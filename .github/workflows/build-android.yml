name: Compilar APK de Android

# Este workflow compila el escaner (android-app/) como un APK nativo de
# Android (con WebView embebido via Capacitor, no un Trusted Web Activity
# -- por eso nunca muestra barra de navegador, sin importar el dominio).
# Se corre en los servidores de GitHub porque el build de Android necesita
# el SDK/Gradle de Google, que no siempre esta disponible desde cualquier
# entorno de desarrollo.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/conectar-escaner-yes-repo-fk9cds
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias (Capacitor)
        working-directory: android-app
        run: npm ci

      - name: Sincronizar Capacitor (copia scanner.html y los assets al proyecto Android)
        working-directory: android-app
        run: npx cap sync android

      - name: Decodificar el keystore de firma
        working-directory: android-app/android/app
        run: echo "${{ secrets.NUVO_KEYSTORE_BASE64 }}" | base64 -d > nuvo-release.keystore

      - name: Compilar el APK firmado
        working-directory: android-app/android
        env:
          NUVO_KEYSTORE_PATH: ${{ github.workspace }}/android-app/android/app/nuvo-release.keystore
          NUVO_KEYSTORE_PASSWORD: ${{ secrets.NUVO_KEYSTORE_PASSWORD }}
          NUVO_KEY_ALIAS: ${{ secrets.NUVO_KEY_ALIAS }}
          NUVO_KEY_PASSWORD: ${{ secrets.NUVO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir el APK como artefacto de esta ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: nuvo-android
          path: android-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # El artefacto de arriba requiere estar logueado en GitHub, viene en un
      # .zip que hay que descomprimir, y expira -- muy dificil de instalar
      # para alguien probando la app en su telefono. Un Release en cambio da
      # UN SOLO link estable (releases/latest) con el .apk suelto para tocar
      # y descargar directo, sin login (el repo es publico) ni descomprimir
      # nada. El tag es siempre el mismo (nuvo-android-test) y se reescribe
      # en cada build, asi el link nunca cambia.
      - name: Publicar como Release (link estable para instalar en el telefono)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android-app/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" NUVO.apk
          gh release delete nuvo-android-test --yes --cleanup-tag || true
          git tag -f nuvo-android-test
          git push origin nuvo-android-test --force
          gh release create nuvo-android-test NUVO.apk \
            --title "NUVO -- build de prueba mas reciente" \
            --notes "Se actualiza solo con cada build nuevo -- este link no cambia. Commit: ${{ github.sha }}"
